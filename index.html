<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- The Seasons (Finest heading font) from Finest's Adobe Fonts web project, as used on finest.co.uk -->
  <link rel="stylesheet" href="https://use.typekit.net/pcx5atw.css">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --f-bg-dark: #002A29;
      --f-bg-light: #083d3b;
      --f-bg-card: rgba(255, 255, 255, 0.05);
      --f-accent: #e7755c;
      --f-green: #22c55e;
      --f-blue: #60a5fa;
      --f-purple: #a855f7;
      --f-grey-light: #e0e0e0;
      --f-grey-medium: #a0a0a0;
      --f-grey-border: rgba(255,255,255,0.1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background:
        radial-gradient(circle at 20% 20%, rgba(231,117,92,0.08), transparent 35%),
        radial-gradient(circle at 80% 10%, rgba(96,165,250,0.06), transparent 30%),
        linear-gradient(180deg, #022f2e 0%, #002A29 100%);
      color: var(--f-grey-light);
      min-height: 100vh;
      padding: 2rem;
    }

    .container { max-width: 1280px; margin: 0 auto; }
    .header {
      margin-bottom: 2rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--f-grey-border);
    }
    .logo { font-size: 1.7rem; font-weight: 700; letter-spacing: 0.28em; color: white; }
    .logo-sub { font-size: 0.68rem; letter-spacing: 0.4em; color: var(--f-grey-medium); text-transform: uppercase; margin-top: 0.2rem; }
    .report-title { font-size: 1.8rem; font-weight: 700; color: white; margin-top: 1rem; }
    .report-subtitle { color: var(--f-grey-medium); font-size: 0.95rem; margin-top: 0.35rem; }

    .loading, .error { text-align: center; padding: 3rem; }
    .loading-spinner {
      width: 40px; height: 40px; border: 3px solid rgba(255,255,255,0.1);
      border-top-color: var(--f-accent); border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 1rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }
    .stat-card, .metric-card, .pr-stat, .chart-section, .pr-section, .ranking-card, .spike-section {
      background: var(--f-bg-card);
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.08);
      backdrop-filter: blur(6px);
    }
    .stat-card { padding: 1.5rem; text-align: center; }
    .stat-value { font-size: 2rem; font-weight: 700; color: var(--f-accent); }
    .stat-value.green { color: var(--f-green); }
    .stat-label { font-size: 0.8rem; color: var(--f-grey-medium); margin-top: 0.25rem; text-transform: uppercase; letter-spacing: 0.05em; }
    .stat-change { font-size: 0.75rem; margin-top: 0.25rem; }
    .stat-change.positive { color: var(--f-green); }
    .stat-change.negative { color: #ef4444; }

    .report-section { background: var(--f-bg-card); border-radius: 16px; border: 1px solid rgba(255,255,255,0.08); padding: 1.5rem; margin-bottom: 1.5rem; }
    .report-section-title, .chart-title, .spike-title { font-size: 1.1rem; font-weight: 600; color: white; margin-bottom: 1rem; }
    .top-properties-table, .data-table { width: 100%; border-collapse: collapse; }
    .top-properties-table th, .data-table th {
      text-align: left; padding: 0.75rem; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--f-grey-medium);
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .top-properties-table td, .data-table td { padding: 0.75rem; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 0.9rem; }
    .top-properties-table tr:last-child td, .data-table tr:last-child td { border-bottom: none; }
    .top-properties-table a, .data-table a, .property-path a, .pr-item-link a { color: var(--f-accent); text-decoration: none; }
    .top-properties-table a:hover, .data-table a:hover, .property-path a:hover, .pr-item-link a:hover { text-decoration: underline; }
    .property-url { font-size: 0.75rem; color: var(--f-grey-medium); }

    .dashboard { display: block; }
    .dashboard-header {
      display: flex; align-items: center; gap: 1.5rem; margin-bottom: 1.5rem;
      padding: 1.25rem 0 0.25rem 0;
    }
    .property-image-wrapper { width: 120px; height: 90px; flex: 0 0 120px; border-radius: 14px; overflow: hidden; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); }
    .property-image { width: 100%; height: 100%; object-fit: cover; display: block; }
    .property-title { font-size: 2.2rem; font-weight: 700; color: white; margin-bottom: 0.25rem; }
    .property-path { color: var(--f-accent); }
    .date-range-display { color: var(--f-grey-light); font-size: 0.95rem; white-space: nowrap; }
    .property-info { flex: 1; }

    .ranking-card {
      display: flex; align-items: center; gap: 1rem; padding: 1.5rem; margin-bottom: 1.25rem;
      background: linear-gradient(135deg, rgba(231,117,92,0.95), rgba(248,165,120,0.9));
      color: white;
    }
    .ranking-icon { font-size: 2.5rem; }
    .ranking-details { flex: 1; }
    .ranking-title { font-size: 0.9rem; opacity: 0.95; margin-bottom: 0.15rem; }
    .ranking-value { font-size: 1.9rem; font-weight: 700; }
    .ranking-subtitle { font-size: 0.95rem; opacity: 0.95; margin-top: 0.25rem; }
    .ranking-badge { background: rgba(255,255,255,0.18); border-radius: 999px; padding: 0.55rem 0.9rem; font-weight: 700; }

    .metrics-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
    .metric-card { padding: 1.3rem; }
    .metric-card.highlight { background: rgba(231,117,92,0.95); color: #10211f; }
    .metric-label { color: var(--f-grey-medium); font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.05em; }
    .metric-card.highlight .metric-label { color: rgba(16,33,31,0.72); }
    .metric-value { font-size: 2.25rem; font-weight: 700; margin-top: 0.55rem; }
    .metric-subtitle { margin-top: 0.35rem; font-size: 0.78rem; color: var(--f-grey-medium); }
    .metric-card.highlight .metric-subtitle { color: rgba(16,33,31,0.72); }
    .property-story-metrics { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .property-story-metrics .metric-card {
      background: rgba(255,255,255,0.035);
      border-radius: 0;
      padding: 0.9rem;
    }
    .property-story-metrics .metric-value { font-size: 1.65rem; }
    .property-story-band { padding: 1.1rem 0; border-bottom: 1px solid rgba(255,255,255,0.08); }
    .property-story-band:last-child { border-bottom: none; }
    .property-story-band-title { margin: 0 0 0.75rem; font-size: 1rem; color: white; }
    .property-story-current { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 0.75rem; }
    .property-story-current-label { color: var(--f-grey-medium); font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.05em; }
    .property-story-current-value { color: white; font-size: 0.9rem; margin-top: 0.2rem; overflow-wrap: anywhere; }
    .property-story-coverage-notice {
      margin-top: 1rem; padding: 0.85rem 1rem; border-left: 3px solid #f4c84a;
      background: rgba(244,200,74,0.1); color: var(--f-grey-light); font-size: 0.82rem;
    }
    .property-story-coverage-notice strong { display: block; margin-bottom: 0.25rem; color: #ffe17d; }
    .property-story-coverage-notice.overdue { border-left-color: #ff7664; background: rgba(255,118,100,0.1); }
    .property-story-coverage-notice.overdue strong { color: #ff9d90; }
    .property-story-primary-metrics { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0.75rem; }
    .property-story-metric { padding: 0.9rem; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.035); }
    .property-story-metric-value { color: white; font-size: 1.65rem; font-weight: 700; }
    .property-story-metric-label { color: var(--f-grey-medium); font-size: 0.68rem; text-transform: uppercase; margin-top: 0.2rem; }
    .property-story-chart { height: 260px; position: relative; }
    .property-story-activity-group { border-bottom: 1px solid rgba(255,255,255,0.08); }
    .property-story-activity-group:last-child { border-bottom: none; }
    .property-story-activity-group > summary {
      cursor: pointer; list-style: none; display: flex; justify-content: space-between;
      align-items: center; gap: 0.75rem; padding: 0.9rem 0; color: white; font-weight: 700;
    }
    .property-story-activity-group > summary::-webkit-details-marker { display: none; }
    .property-story-activity-group > summary::after { content: 'Show'; color: var(--f-grey-medium); font-size: 0.7rem; font-weight: 500; }
    .property-story-activity-group[open] > summary::after { content: 'Hide'; }
    .property-story-activity-count { color: var(--f-grey-medium); font-size: 0.72rem; font-weight: 500; margin-left: 0.35rem; }
    .property-story-row { display: grid; grid-template-columns: 7rem 1fr auto; gap: 0.8rem; padding: 0.75rem 0; border-bottom: 1px solid rgba(255,255,255,0.06); align-items: start; }
    .property-story-row-date { color: var(--f-grey-medium); font-size: 0.78rem; }
    .property-story-row-title { color: white; font-size: 0.86rem; font-weight: 600; }
    .property-story-row-detail { color: var(--f-grey-light); font-size: 0.76rem; margin-top: 0.18rem; }
    .property-story-row-type { color: var(--f-grey-medium); font-size: 0.66rem; text-transform: uppercase; }
    .property-story-caption { color: var(--f-grey-light); font-size: 0.76rem; margin-top: 0.3rem; }
    .property-story-caption summary { cursor: pointer; color: var(--f-grey-medium); outline: none; }

    .chart-section { padding: 1.5rem; margin-bottom: 1.5rem; }
    .chart-container { height: 360px; position: relative; }
    .two-column { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-bottom: 1.5rem; }

    .spike-section { padding: 1.5rem; margin-bottom: 1.5rem; border-left: 4px solid var(--f-accent); }
    .spike-header { display: flex; align-items: center; gap: 0.85rem; margin-bottom: 1rem; }
    .spike-icon {
      width: 36px; height: 36px; border-radius: 50%; background: rgba(231,117,92,0.18); color: var(--f-accent);
      display: inline-flex; align-items: center; justify-content: center; font-weight: 700;
    }
    .spike-list { list-style: none; display: grid; gap: 1rem; }
    .spike-item { padding: 1rem; border-radius: 12px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06); }
    .spike-date { font-size: 1.1rem; font-weight: 700; color: white; margin-bottom: 0.35rem; }
    .spike-badge { margin-left: 0.5rem; background: rgba(34,197,94,0.2); color: #86efac; padding: 0.18rem 0.45rem; border-radius: 8px; font-size: 0.85rem; }
    .spike-details { color: var(--f-grey-medium); font-size: 0.9rem; margin-bottom: 0.55rem; }
    .spike-narrative { color: var(--f-grey-light); line-height: 1.5; margin-bottom: 0.6rem; }
    .spike-pr-link { margin-top: 0.45rem; padding: 0.6rem 0.75rem; border-radius: 10px; background: rgba(231,117,92,0.13); border-left: 3px solid var(--f-accent); font-size: 0.9rem; }
    .spike-pr-link-text { color: var(--f-grey-light); }
    .spike-pr-link-pub { font-weight: 600; color: white; }
    .no-spikes { color: var(--f-grey-medium); padding: 1rem 0; }

    .pr-section { padding: 1.5rem; }
    .pr-header { display: flex; justify-content: space-between; gap: 1rem; align-items: flex-start; margin-bottom: 1.25rem; }
    .pr-title { font-size: 2rem; font-weight: 700; color: white; display: flex; gap: 0.7rem; align-items: center; }
    .pr-title-icon { font-size: 1.7rem; }
    .pr-sync-info { color: var(--f-grey-medium); font-size: 0.82rem; white-space: nowrap; }
    .pr-stats { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 1rem; margin-bottom: 1rem; }
    .pr-stat { padding: 1.2rem; text-align: center; }
    .pr-stat-value { font-size: 2.2rem; font-weight: 700; color: var(--f-accent); }
    .pr-stat-label { margin-top: 0.35rem; color: var(--f-grey-medium); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; }
    .pr-stat-id { display: flex; flex-direction: column; justify-content: center; text-align: left; }
    .pr-stat-id .pr-stat-value { font-size: 1.8rem; }
    .pr-tabs { display: flex; flex-wrap: wrap; gap: 0.75rem; margin-bottom: 1.2rem; }
    .pr-tab {
      background: transparent; color: var(--f-grey-light); border: none; padding: 0.55rem 0.9rem; border-radius: 10px; cursor: pointer; font: inherit;
    }
    .pr-tab.active { background: var(--f-accent); color: white; }
    .pr-tab-count { margin-left: 0.4rem; color: inherit; opacity: 0.8; }
    .pr-content { display: none; }
    .pr-content.active { display: block; }
    .pr-empty { padding: 2rem 0; text-align: center; color: var(--f-grey-medium); }
    .pr-empty-icon { font-size: 1.5rem; margin-bottom: 0.5rem; }
    .pr-timeline { display: grid; gap: 0.75rem; }
    .pr-item { padding: 1rem; border-radius: 12px; background: rgba(255,255,255,0.04); border-left: 4px solid var(--f-accent); }
    .pr-item-header { display: flex; justify-content: space-between; gap: 1rem; align-items: flex-start; margin-bottom: 0.35rem; }
    .pr-item-publication { color: white; font-weight: 700; }
    .pr-item-date { color: var(--f-grey-medium); font-size: 0.9rem; white-space: nowrap; }
    .pr-item-theme { color: var(--f-grey-light); margin-bottom: 0.35rem; }
    .pr-not-found { padding: 2rem; text-align: center; color: var(--f-grey-medium); }
    .pr-not-found-icon { font-size: 2rem; margin-bottom: 0.7rem; }

    .alert-strip {
      background: rgba(239,68,68,0.12); border: 1px solid rgba(239,68,68,0.35); color: #fecaca; border-radius: 8px;
      padding: 0.55rem 0.75rem; font-size: 0.78rem; line-height: 1.4; margin-bottom: 1rem;
    }

    .sm-stats-bar {
      display: flex; gap: 0; margin-top: 0.45rem; border-radius: 8px; overflow: hidden;
      background: rgba(0,0,0,0.16); border: 1px solid rgba(255,255,255,0.08);
    }
    .sm-stats-bar > div { flex: 1; text-align: center; padding: 0.45rem 0.25rem; border-right: 1px solid rgba(255,255,255,0.06); }
    .sm-stats-bar > div:last-child { border-right: none; }
    .sm-stat-val { font-size: 0.9rem; font-weight: 700; color: var(--f-grey-light); }
    .sm-stat-lbl { font-size: 0.56rem; color: var(--f-grey-medium); text-transform: uppercase; letter-spacing: 0.3px; }

    .footer { text-align: center; padding: 2rem; color: var(--f-grey-medium); font-size: 0.8rem; }

    .cp-accordion { display: block; }
    .cp-accordion-summary {
      list-style: none; cursor: pointer; display: flex; align-items: center; justify-content: space-between;
      gap: 1rem; margin-bottom: 1rem;
    }
    .cp-accordion-summary::-webkit-details-marker { display: none; }
    .cp-accordion-arrow { color: var(--f-grey-medium); font-size: 1.1rem; line-height: 1; transition: transform 0.15s ease; }
    .cp-accordion[open] > .cp-accordion-summary .cp-accordion-arrow { transform: rotate(180deg); color: white; }
    .cp-section-title { font-size: 1.5rem; font-weight: 700; color: white; margin: 0; }
    .cp-badge { display: inline-block; padding: 0.12rem 0.42rem; border-radius: 999px; font-size: 0.7rem; font-weight: 600; }
    .cp-status-ok { color: #86efac; }
    .cp-status-warn { background: rgba(239,68,68,0.2); color: #fca5a5; }
    .cp-gap-row td { background: rgba(249,115,22,0.05); color: #f97316; font-size: 0.75rem; }
    .cp-group-title {
      list-style: none; cursor: pointer; display: flex; justify-content: space-between; align-items: center; padding: 0.75rem 1rem;
      border-radius: 10px; border: 1px solid rgba(255,255,255,0.08); margin-bottom: 0.5rem;
      background: rgba(255,255,255,0.04); color: white; font-weight: 600;
    }
    .cp-group-title::-webkit-details-marker { display: none; }
    .cp-group-arrow { margin-left: auto; color: var(--f-grey-medium); font-size: 1rem; line-height: 1; transition: transform 0.15s ease; }
    .cp-group-accordion[open] > .cp-group-title .cp-group-arrow { transform: rotate(180deg); color: white; }
    .cp-note-row td { padding-top: 0; color: #fbbf24; font-size: 0.8rem; }
    .cp-calendar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 0.9rem;
    }
    .cp-day-card {
      min-height: 240px;
      padding: 0.85rem;
      border-radius: 14px;
      background: rgba(8,61,59,0.72);
      border: 1px solid rgba(255,255,255,0.12);
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
    }
    .cp-day-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 0.6rem;
      padding-bottom: 0.6rem;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .cp-day-title { font-size: 1rem; font-weight: 800; color: white; }
    .cp-day-date { color: var(--f-grey-medium); font-size: 0.78rem; white-space: nowrap; }
    .cp-slot {
      padding: 0.55rem;
      border-radius: 10px;
      background: rgba(0,0,0,0.12);
      border: 1px dashed rgba(255,255,255,0.1);
    }
    .cp-slot-label {
      color: #93c5fd;
      font-size: 0.68rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-bottom: 0.38rem;
    }
    .cp-empty-slot { color: rgba(255,255,255,0.28); font-size: 0.72rem; }
    .cp-post-card {
      border-left: 3px solid var(--f-accent);
      border-radius: 8px;
      padding: 0.5rem 0.55rem;
      background: #334155;
      margin-bottom: 0.4rem;
    }
    .cp-post-card.facebook {
      border-left-color: #1877f2;
      background: linear-gradient(135deg, #174f78, #123d61);
    }
    .cp-post-card.instagram {
      border-left-color: #e1306c;
      background: linear-gradient(135deg, #4d236f 0%, #7a274d 55%, #7a4526 100%);
    }
    .cp-post-card.linkedin {
      border-left-color: #0a66c2;
      background: linear-gradient(135deg, #0b4a73, #083859);
    }
    .cp-post-card.tiktok {
      border-left-color: #000000;
      background: linear-gradient(135deg, #000000, #111111);
    }
    .cp-post-card.newsletter {
      border-left-color: #8b5cf6;
      background: linear-gradient(135deg, #4c3375, #3e225f);
    }
    .cp-post-card:last-child { margin-bottom: 0; }
    .cp-post-title { color: white; font-weight: 800; font-size: 0.86rem; line-height: 1.25; }
    .cp-post-meta { color: rgba(255,255,255,0.76); font-size: 0.74rem; margin-top: 0.18rem; line-height: 1.35; }
    .cp-platform {
      display: inline-block;
      padding: 0.12rem 0.38rem;
      border-radius: 5px;
      background: #1877f2;
      color: white;
      font-size: 0.66rem;
      font-weight: 800;
      margin-top: 0.32rem;
    }
    .cp-platform.instagram { background: linear-gradient(135deg, #833ab4, #e1306c, #f77737); }
    .cp-platform.linkedin { background: #0a66c2; }
    .cp-platform.tiktok { background: #000000; }
    .cp-platform.newsletter { background: #8b5cf6; }
    .cp-reason {
      display: inline-block;
      margin-left: 0.25rem;
      padding: 0.12rem 0.38rem;
      border-radius: 5px;
      font-size: 0.62rem;
      font-weight: 900;
      text-transform: uppercase;
      border: 1px solid rgba(96,165,250,0.28);
      color: #bfdbfe;
      background: rgba(59,130,246,0.16);
    }
    .cp-reason.price { color: #fde047; background: rgba(251,191,36,0.18); border-color: rgba(251,191,36,0.32); }
    .cp-attention { margin-top: 0.32rem; color: #fca5a5; font-size: 0.7rem; font-weight: 700; }

    @media (max-width: 980px) {
      .metrics-grid, .pr-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .property-story-current { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .property-story-primary-metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .two-column { grid-template-columns: 1fr; }
      .dashboard-header { flex-direction: column; align-items: flex-start; }
      .property-title { font-size: 1.8rem; }
    }

    @media (max-width: 720px) {
      body { padding: 1rem; }
      .stats-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .ranking-card { flex-direction: column; align-items: flex-start; }
      .pr-item-header { flex-direction: column; }
      .chart-container { height: 280px; }
      .cp-calendar { grid-template-columns: 1fr; }
      .property-story-current { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .property-story-row { grid-template-columns: 1fr; gap: 0.25rem; }
      .property-story-row-type { margin-top: 0.15rem; }
    }

<body>
  <div class="container">
    <div class="header">
      <div class="logo">FINEST</div>
      <div class="logo-sub"></div>
      <h1 class="report-title" id="reportTitle">Your marketing report</h1>
      <p class="report-subtitle" id="reportSubtitle">Preparing your report</p>
    </div>

    <div id="content">
      <div class="loading">
        <div class="loading-spinner"></div>
        <p id="loadingMessage">Loading your report…</p>
      </div>
    </div>

    <div class="footer">Finest Analytics</div>
  </div>

  <script>
    // This page runs in two places: inside Apps Script (token templated in,
    // data via google.script.run) and on reports.finest.co.uk (token from the
    // address, data fetched from the Apps Script web app without cookies).
    var REPORT_DATA_URL = 'https://script.google.com/macros/s/AKfycbzK5CIMm6RgYUyt-6_7Ygmrtp7QmXUSYOi3beuqnZ1Zkxi3gxYGKS-1CwmOrun3w_vF/exec';
    var reportToken = '<?= reportToken ?>';
    if (!/^[A-Za-z0-9]{8,}$/.test(reportToken)) {
      var reportParams = new URLSearchParams(window.location.search);
      reportToken = reportParams.get('r') || reportParams.get('token') || '';
    }
    var trendChartInstance = null;
    var channelChartInstance = null;
    var currentPropertyData = null;
    var currentPRData = null;

    document.addEventListener('DOMContentLoaded', function() {
      loadStoredReport();
      // Apps Script can take several seconds to respond; reassure rather than
      // leave a bare spinner. (The element is replaced once the report loads.)
      setTimeout(function() {
        var msg = document.getElementById('loadingMessage');
        if (msg) msg.textContent = 'Gathering the latest figures for your report. This can take a few seconds…';
      }, 4000);
      setTimeout(function() {
        var msg = document.getElementById('loadingMessage');
        if (msg) msg.textContent = 'Nearly there. Thanks for your patience…';
      }, 12000);
    });

    function loadStoredReport() {
      // Preview inside the staff app: the report is passed in directly.
      if (window.PREVIEW_REPORT) {
        handleStoredReport({ success: true, reportData: window.PREVIEW_REPORT });
        return;
      }
      if (window.google && google.script && google.script.run) {
        google.script.run
          .withSuccessHandler(handleStoredReport)
          .withFailureHandler(function(err) {
            showError('Failed to load report: ' + err);
          })
          .getStoredReportData(reportToken);
        return;
      }
      if (!/^[A-Za-z0-9]{8,}$/.test(reportToken)) {
        showReportExpired();
        return;
      }
      fetchReportData(1);
    }

    // Apps Script occasionally stalls (e.g. just after a new version is
    // deployed), so a request that fails or takes over 20 seconds is tried
    // up to three times before the client sees an error. An expired link is a normal
    // answer, not a failure, and is never retried.
    function fetchReportData(attempt) {
      var controller = window.AbortController ? new AbortController() : null;
      var timer = controller ? setTimeout(function() { controller.abort(); }, 20000) : null;
      var options = { credentials: 'omit', redirect: 'follow' };
      if (controller) options.signal = controller.signal;
      fetch(REPORT_DATA_URL + '?format=json&token=' + encodeURIComponent(reportToken), options)
        .then(function(response) { return response.json(); })
        .then(function(result) {
          if (timer) clearTimeout(timer);
          handleStoredReport(result);
        })
        .catch(function() {
          if (timer) clearTimeout(timer);
          if (attempt < 3) {
            setTimeout(function() { fetchReportData(attempt + 1); }, 1500);
            return;
          }
          showReportNotice('We couldn\u2019t load your report just now',
            'Please check your connection and try again in a moment.', true);
        });
    }

    function renderContentPlanningCalendar(days) {
      if (!days || !days.length) {
        return '<div class="pr-empty"><div class="pr-empty-icon">📅</div><p>No scheduled posts in this snapshot.</p></div>';
      }

      var slots = ['07:30', '11:00', '17:00', '20:00'];
      var html = '<div class="cp-calendar">';
      for (var i = 0; i < days.length; i++) {
        var day = days[i] || {};
        var posts = day.posts || [];
        var groupedPosts = groupCpCalendarPosts(posts);
        var fbBySlot = {};
        var otherPosts = [];
        for (var s = 0; s < slots.length; s++) fbBySlot[slots[s]] = [];

        for (var p = 0; p < groupedPosts.length; p++) {
          var post = groupedPosts[p] || {};
          var platform = String(post.platform || '').toLowerCase();
          var time = normalizeCpPostTime(post.postTime);
          if (platform.indexOf('facebook') !== -1 && fbBySlot[time]) {
            fbBySlot[time].push(post);
          } else {
            otherPosts.push(post);
          }
        }

        html += '<article class="cp-day-card">';
        html += '<div class="cp-day-head"><div><div class="cp-day-title">' + escapeHtml(getCpDayLabel(day.date)) + '</div><div class="cp-day-date">' + escapeHtml(day.date || '') + '</div></div>';
        html += '<div class="cp-day-date">' + groupedPosts.length + ' post' + (groupedPosts.length === 1 ? '' : 's') + '</div></div>';

        for (var fs = 0; fs < slots.length; fs++) {
          var slot = slots[fs];
          html += '<div class="cp-slot">';
          html += '<div class="cp-slot-label">Facebook ' + slot + '</div>';
          if (fbBySlot[slot].length) {
            for (var fp = 0; fp < fbBySlot[slot].length; fp++) {
              html += renderCpPostCard(fbBySlot[slot][fp], slot);
            }
          } else {
            html += '<div class="cp-empty-slot">No Facebook post</div>';
          }
          html += '</div>';
        }

        if (otherPosts.length) {
          html += '<div class="cp-slot">';
          html += '<div class="cp-slot-label" style="color:var(--f-grey-medium);">Other platforms / date-only</div>';
          for (var op = 0; op < otherPosts.length; op++) {
            html += renderCpPostCard(otherPosts[op], normalizeCpPostTime(otherPosts[op].postTime));
          }
          html += '</div>';
        }

        html += '</article>';
      }
      html += '</div>';
      return html;
    }

    function groupCpCalendarPosts(posts) {
      posts = posts || [];
      var groups = {};
      var output = [];
      for (var i = 0; i < posts.length; i++) {
        var post = posts[i] || {};
        var groupId = String(post.postGroupId || '').trim();
        if (!groupId) {
          var single = Object.assign({}, post);
          single.groupCount = 1;
          single.groupedProperties = [{
            propertyId: post.propertyId,
            propertyName: post.propertyName,
            agent: post.agent
          }];
          output.push(single);
          continue;
        }
        if (!groups[groupId]) {
          var grouped = Object.assign({}, post);
          grouped.groupCount = 0;
          grouped.groupedProperties = [];
          grouped.groupRowNumbers = [];
          grouped.locked = !!post.locked;
          groups[groupId] = grouped;
          output.push(grouped);
        }
        var target = groups[groupId];
        if (post.locked) target.locked = true;
        if (post.rowNumber) target.groupRowNumbers.push(post.rowNumber);
        target.groupedProperties.push({
          propertyId: post.propertyId,
          propertyName: post.propertyName,
          agent: post.agent
        });
        target.groupCount = target.groupedProperties.length;
      }
      return output;
    }

    function renderCpPostCard(post, fallbackTime) {
      var platform = post.platform || '';
      var platformClass = getCpPlatformClass(platform);
      var time = normalizeCpPostTime(post.postTime) || fallbackTime || '';
      var statusHtml = post.needsAttention
        ? '<div class="cp-attention">' + escapeHtml(post.propertyStatus || 'Needs attention') + '</div>'
        : '';

        }
      } else {
        html += '<div class="cp-post-title">' + escapeHtml(title) + ' <span class="property-url">' + escapeHtml(post.propertyId || '') + '</span></div>';
      }
      html += '<div class="cp-post-meta">' + escapeHtml(displayOffice(post.agent) || '') + (time ? ' · ' + escapeHtml(time) : '') + escapeHtml(themeText) + '</div>';
      html += '<span class="cp-platform ' + platformClass + '">' + escapeHtml(getCpPlatformLabel(platform)) + '</span>';
      html += renderCpReasonBadge(post.contentReason);
      html += statusHtml;
      html += '</div>';
      return html;
    }

    function normalizeCpPostTime(time) {
      var raw = String(time || '').trim();
      var match = raw.match(/(\d{1,2})[:.](\d{2})/);
      if (!match) return '';
      var hour = String(match[1]).padStart(2, '0');
      return hour + ':' + match[2];
    }

    function getCpPlatformClass(platform) {
      var p = String(platform || '').toLowerCase();
      if (p.indexOf('facebook') !== -1) return 'facebook';
      if (p.indexOf('instagram') !== -1) return 'instagram';
      if (p.indexOf('linkedin') !== -1) return 'linkedin';
      if (p.indexOf('tiktok') !== -1 || p.indexOf('tik tok') !== -1) return 'tiktok';
      if (p.indexOf('newsletter') !== -1) return 'newsletter';
      return '';
    }

    function getCpPlatformLabel(platform) {
      var p = String(platform || '').toLowerCase();
      if (p.indexOf('facebook') !== -1) return 'Facebook';
      if (p.indexOf('instagram') !== -1) return 'Instagram';
      if (p.indexOf('linkedin') !== -1) return 'LinkedIn';
      if (p.indexOf('tiktok') !== -1 || p.indexOf('tik tok') !== -1) return 'TikTok';
      if (p.indexOf('newsletter') !== -1) return 'Newsletter';
      return platform || 'Activity';
    }

    function getCpReasonLabel(reason) {
      var raw = String(reason || '').trim();
      var norm = raw.toLowerCase();
      if (!raw || norm === 'regular' || norm === 'general') return '';
      if (norm === 'price change' || norm === 'new price' || norm === 'price reduction') return 'New price';
      if (norm === 'new listing' || norm === 'new launch') return 'New listing';
      if (norm === 'partner priority') return 'Priority';
      if (norm === 'needs a push') return 'Push';
      if (norm === 'relaunch' || norm === 're-launch') return 'Relaunch';
      return raw;
    }

    function renderCpReasonBadge(reason) {
      var label = getCpReasonLabel(reason);
      if (!label) return '';
      var norm = String(reason || '').trim().toLowerCase();
      var cls = (norm === 'price change' || norm === 'new price' || norm === 'price reduction') ? ' price' : '';
      return '<span class="cp-reason' + cls + '">' + escapeHtml(label) + '</span>';
    }

    function getCpDayLabel(dateStr) {
      var parts = String(dateStr || '').split('/');
      if (parts.length !== 3) return 'Scheduled';
      var d = new Date(Number(parts[2]), Number(parts[1]) - 1, Number(parts[0]));
      if (isNaN(d.getTime())) return 'Scheduled';
      var days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
      return days[d.getDay()];
    }

    // Colours sent with the report (the main app's single-source AGENT_COLORS_
    // plus any AgentStatus sheet overrides). Populated when a report renders;
    // the local map below is only a fallback for older share links without it.
    var shareAgentColors = null;

    function getShareAgentColor(agent) {
      var key = String(agent || '').trim().toLowerCase();
      if (shareAgentColors && shareAgentColors[key]) return shareAgentColors[key];
      var known = {
        'country & equestrian': '#d9ff57',
        'country and equestrian': '#d9ff57',
        'currans': '#a3ff5f',
        'finest': '#ff5c70',
        'finest head office': '#ff5c70',
        'finest cheshire': '#ff9f43',
        'finest cumbria north': '#ffcf48',
        'finest cumbria south': '#ff6f91',
        'garrison estates': '#65f58d',
        'house & heritage': '#ff4fb8',
        'house and heritage': '#ff4fb8',
        'morgan aps': '#6ef7ad',
        'rohrs & rowe': '#5ef4e2',
        'rohrs and rowe': '#5ef4e2',
        'sowerbys': '#60a5fa',
        'the coastal house': '#c061ff',
        'lune valley': '#a78bfa',
        'maison': '#f472b6',
        'fitzjohn estates': '#38bdf8'
      };
      if (known[key]) return known[key];
      var hash = 0;
      for (var i = 0; i < key.length; i++) {
        hash = ((hash << 5) - hash) + key.charCodeAt(i);
        hash |= 0;
      }
      var hue = Math.abs(hash) % 360;
      return 'hsl(' + hue + ', 82%, 70%)';
    }

      html += '<section class="property-story-band"><h3 class="property-story-band-title">Performance</h3><div class="property-story-primary-metrics">';
      var storyMetrics = [

      if (!socials.length) html += '<div class="pr-empty" style="padding:0.9rem 0;"><p>No social or newsletter activity in this report period.</p></div>';
      for (var si = 0; si < socials.length; si++) {
        var social = socials[si];

        var socialIsInstagram = socialWho.indexOf('instagram') !== -1;
        var socialIsFacebook = socialWho.indexOf('facebook') !== -1;
        html += '<div class="property-story-row"><div class="property-story-row-date">' + escapeHtml(social.date || '') + '</div><div><div class="property-story-row-title">' + escapeHtml(social.who || social.feature || 'Marketing activity') + '</div>';
        if (social.theme) html += '<details class="property-story-caption"><summary>View caption or theme</summary><div class="property-story-row-detail">' + escapeHtml(social.theme) + '</div></details>';
        if (social.link) html += '<div class="pr-item-link"><a href="' + escapeHtml(social.link) + '" target="_blank" rel="noopener">' + ((social.feature || '').toLowerCase() === 'newsletter' ? 'View newsletter' : 'View post') + ' →</a></div>';
        if (social.stats && (socialIsFacebook || socialIsInstagram)) {
          var socialStats = social.stats;
          var publicStats = socialIsInstagram ? [
            ['Views', socialStats.views], ['Reach', socialStats.reach], ['Likes', socialStats.likes], ['Comments', socialStats.comments], ['Shares', socialStats.shares], ['Saves', socialStats.saves]
          ] : [
            ['Views', socialStats.views], ['Reach', socialStats.reach], ['Reactions', socialStats.reactions], ['Comments', socialStats.comments], ['Shares', socialStats.shares], ['Link clicks', socialStats.linkClicks]
          ];

          html += '</div>';

      html += '</details>';

      html += '<details class="property-story-activity-group"><summary><span>PR submissions <span class="property-story-activity-count">' + submissions.length + '</span></span></summary>';
      if (!submissions.length) html += '<div class="pr-empty" style="padding:0.9rem 0;"><p>No PR submissions in this report period.</p></div>';
      for (var subi = 0; subi < submissions.length; subi++) {
        html += '<div class="property-story-row"><div class="property-story-row-date">' + escapeHtml(submissions[subi].date || '') + '</div><div><div class="property-story-row-title">' + escapeHtml(submissions[subi].publication || 'PR submission') + '</div>';
        if (submissions[subi].theme) html += '<div class="property-story-row-detail">' + escapeHtml(submissions[subi].theme) + '</div>';
        html += '</div><div class="property-story-row-type">PR submission</div></div>';
      }
      html += '</details>';

      html += '<details class="property-story-activity-group"><summary><span>PR features <span class="property-story-activity-count">' + features.length + '</span></span></summary>';
      if (!features.length) html += '<div class="pr-empty" style="padding:0.9rem 0;"><p>No PR features in this report period.</p></div>';
      for (var fi = 0; fi < features.length; fi++) {
        html += '<div class="property-story-row"><div class="property-story-row-date">' + escapeHtml(features[fi].date || '') + '</div><div><div class="property-story-row-title">' + escapeHtml(features[fi].publication || 'PR feature') + '</div>';
        if (features[fi].theme) html += '<div class="property-story-row-detail">' + escapeHtml(features[fi].theme) + '</div>';
        if (features[fi].link) html += '<div class="pr-item-link"><a href="' + escapeHtml(features[fi].link) + '" target="_blank" rel="noopener">View article →</a></div>';
        html += '</div><div class="property-story-row-type">PR feature</div></div>';
      }
      html += '</details></section></section>';

      document.getElementById('content').innerHTML = html;
      if (analytics.dailyTrend && analytics.dailyTrend.length) {
        var storyChartData = Object.assign({}, analytics, { spikes: [] });
        displayTrendChart(storyChartData);

    }

    function propertyStoryDateValue_(value) {
      var raw = String(value || '').trim();
      var uk = raw.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
      if (uk) return new Date(Number(uk[3]), Number(uk[2]) - 1, Number(uk[1])).getTime();
      var parsed = new Date(raw);
      return isNaN(parsed.getTime()) ? 0 : parsed.getTime();
    }

    function displayMetrics(data) {
      var grid = document.getElementById('metricsGrid');
      var m = data.metrics || {};
      var e = data.enquiries || {};
      var engagementRate = (((m.engagementRate || 0) * 100)).toFixed(1);
      var avgDuration = formatDuration(m.avgSessionDuration || 0);
      var formDatesDisplay = '';
      if (e.formSubmitDates && e.formSubmitDates.length > 0) {
        var uniqueDates = [];
        for (var i = 0; i < e.formSubmitDates.length; i++) {
          if (uniqueDates.indexOf(e.formSubmitDates[i]) === -1) uniqueDates.push(e.formSubmitDates[i]);
        }
        formDatesDisplay = uniqueDates.map(formatDisplayDate).join(', ');
      }

      var metrics = [
        { label: 'Page Views', value: (m.pageViews || 0).toLocaleString(), highlight: true, subtitle: null },
        { label: 'Engagement Rate', value: engagementRate + '%', highlight: false, subtitle: null },
        { label: 'Avg. Duration', value: avgDuration, highlight: false, subtitle: null },
        { label: 'Brochure Downloads', value: ((e.brochureDownloads || e.fileDownloads || 0)).toLocaleString(), highlight: false, subtitle: null },
        { label: 'Form Submissions', value: (e.formSubmits || 0).toLocaleString(), highlight: true, subtitle: formDatesDisplay }
      ];

      var html = '';
      for (var k = 0; k < metrics.length; k++) {
        html += '<div class="metric-card' + (metrics[k].highlight ? ' highlight' : '') + '">';
        html += '<div class="metric-label">' + metrics[k].label + '</div>';
        html += '<div class="metric-value">' + metrics[k].value + '</div>';
        if (metrics[k].subtitle) html += '<div class="metric-subtitle">' + escapeHtml(metrics[k].subtitle) + '</div>';
        html += '</div>';
      }
      grid.innerHTML = html;
    }

    function displayTrendChart(data) {
      var canvas = document.getElementById('trendChart');
      if (!canvas) return;
      var ctx = canvas.getContext('2d');
      if (trendChartInstance) trendChartInstance.destroy();

      var labels = [];
      var views = [];
      var spikeDates = {};
      (data.spikes || []).forEach(function(spike) { spikeDates[spike.date] = true; });
      (data.dailyTrend || []).forEach(function(item) {
        labels.push(formatChartDate(item.date));
        views.push(item.pageViews || 0);
      });
      var pointColors = (data.dailyTrend || []).map(function(item) { return spikeDates[item.date] ? '#e7755c' : 'transparent'; });
      var pointRadius = (data.dailyTrend || []).map(function(item) { return spikeDates[item.date] ? 6 : 0; });

      trendChartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [{
            data: views,
            borderColor: '#e7755c',
            backgroundColor: 'rgba(231, 117, 92, 0.14)',
            fill: true,
            tension: 0.3,
            pointBackgroundColor: pointColors,
            pointBorderColor: pointColors,
            pointRadius: pointRadius,
            pointHoverRadius: 8
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            x: { grid: { display: false }, ticks: { maxTicksLimit: 10, color: '#a0a0a0' } },
            y: { beginAtZero: true, grid: { color: 'rgba(255,255,255,0.08)' }, ticks: { color: '#a0a0a0' } }
          }
        }
      });
    }

    function displaySpikes(data) {
      var section = document.getElementById('spikeSection');
      if (!section) return;
      if (!data.spikes || data.spikes.length === 0) {
        section.innerHTML = '<div class="no-spikes"><p>No significant traffic spikes detected in this period</p></div>';
        return;
      }

      var html = '<div class="spike-header"><div class="spike-icon">!</div><h3 class="spike-title">Traffic Spikes Detected</h3></div><ul class="spike-list">';
      for (var i = 0; i < data.spikes.length; i++) {
        var spike = data.spikes[i];
        var analysis = (data.spikeAnalysis || [])[i] || {};
        var prMatch = findPRMatch(spike.date);
        var socialMatch = findSocialMatch(spike.date);
        html += '<li class="spike-item">';
        html += '<div class="spike-date">' + formatDisplayDate(spike.date) + ' <span class="spike-badge">+' + spike.increasePercent + '%</span></div>';
        html += '<div class="spike-details">' + spike.views + ' views (avg: ' + spike.rollingAvg + ')</div>';
        html += '<div class="spike-narrative">' + escapeHtml(analysis.narrative || 'Analyzing...') + '</div>';
        if (prMatch) {
          html += '<div class="spike-pr-link"><span class="spike-pr-link-text">📰 Likely linked to PR: </span><span class="spike-pr-link-pub">' + escapeHtml(prMatch.publication) + '</span>' + formatDayDiff(prMatch.daysApart) + '</div>';
        }
        if (socialMatch) {
          html += '<div class="spike-pr-link" style="background: rgba(59,130,246,0.2); border-left-color:#3b82f6;"><span class="spike-pr-link-text">📱 Likely linked to Social: </span><span class="spike-pr-link-pub">' + escapeHtml(socialMatch.platform) + '</span>' + formatDayDiff(socialMatch.daysApart) + '</div>';
        }
        html += '</li>';
      }
      html += '</ul>';
      section.innerHTML = html;
    }

    function displayChannelChart(data) {
      var canvas = document.getElementById('channelChart');
      if (!canvas) return;
      var ctx = canvas.getContext('2d');
      if (channelChartInstance) channelChartInstance.destroy();
      var channels = (data.channelData || []).slice(0, 8);
      var colors = ['#e7755c', '#4ade80', '#60a5fa', '#f87171', '#fbbf24', '#a78bfa', '#fb7185', '#a0a0a0'];
      channelChartInstance = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: channels.map(function(c) { return c.channel; }),
          datasets: [{ data: channels.map(function(c) { return c.sessions; }), backgroundColor: colors, borderWidth: 0 }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { position: 'right', labels: { boxWidth: 12, padding: 15, font: { size: 12 }, color: '#ffffff' } }
          }
        }
      });
    }

    function displaySourceTable(data) {
      var tbody = document.querySelector('#sourceTable tbody');
      if (!tbody) return;
      var rows = (data.sourceData || []).slice(0, 20);
      var grouped = {};

      rows.forEach(function(row) {
        var sourceName = String(row.source || '').trim();
        var mediumName = String(row.medium || '').trim();
        var sourceLower = sourceName.toLowerCase();
        var mediumLower = mediumName.toLowerCase();
        var key;

        if (
          (sourceLower === 'twitter.com' && mediumLower === 'social') ||
          (sourceLower.indexOf('facebook') !== -1 && mediumLower === 'referral') ||
          sourceLower === 'fb' ||
          sourceLower.indexOf('m.facebook') !== -1 ||
          sourceLower.indexOf('l.facebook') !== -1 ||
          sourceLower.indexOf('lm.facebook') !== -1
        ) {
          key = 'Facebook / social';
        } else if (sourceLower === 'facebook.com' && mediumLower === 'social') {
          key = 'Facebook / social';
        } else if (sourceLower.indexOf('instagram') !== -1 || sourceLower === 'ig' || sourceLower.indexOf('l.instagram') !== -1) {
          key = 'Instagram / ' + mediumName;
        } else {
          key = (sourceName || '(not set)') + ' / ' + (mediumName || '(not set)');
        }

        if (!grouped[key]) grouped[key] = { sessions: 0, users: 0 };
        grouped[key].sessions += row.sessions || 0;
        grouped[key].users += row.users || 0;
      });

      var groupedRows = Object.keys(grouped).map(function(name) {
        return {
          name: name,
          sessions: grouped[name].sessions,
          users: grouped[name].users
        };
      }).sort(function(a, b) {
        return b.sessions - a.sessions;
      }).slice(0, 10);

      var html = '';
      groupedRows.forEach(function(row) {
        html += '<tr><td>' + escapeHtml(row.name) + '</td><td style="text-align:right">' + row.sessions.toLocaleString() + '</td><td style="text-align:right">' + row.users.toLocaleString() + '</td></tr>';
      });
      tbody.innerHTML = html;
    }

    function displayPRData(prData, startDate, endDate) {
      var prContent = document.getElementById('prContent');
      var prSyncInfo = document.getElementById('prSyncInfo');
      currentPRData = prData || {};

      if (prData.lastSyncTime) {
        var syncDate = new Date(prData.lastSyncTime);
        prSyncInfo.textContent = 'Last synced: ' + syncDate.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }) + ' at ' + syncDate.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' }) + ' (updates every 4 hours)';
      }

      if (!prData.propertyId) {
        prContent.innerHTML = '<div class="pr-not-found"><div class="pr-not-found-icon">📋</div><p>This property is not in the PR tracking system</p><p style="font-size:0.8rem; margin-top:0.5rem; opacity:0.7;">Only Finest properties with a URA ID are tracked</p></div>';

      html += '<div class="pr-stat"><div class="pr-stat-value">' + filteredSocial.length + '</div><div class="pr-stat-label">Social</div></div>';
      html += '<div class="pr-stat"><div class="pr-stat-value">' + filteredSubmissions.length + '</div><div class="pr-stat-label">Submissions</div></div>';

      html += '<div class="pr-tabs">';

      html += '<button class="pr-tab" onclick="switchPRTab(\'social\', this)">Social<span class="pr-tab-count">' + filteredSocial.length + '</span></button>';
      html += '<button class="pr-tab" onclick="switchPRTab(\'submissions\', this)">Submissions<span class="pr-tab-count">' + filteredSubmissions.length + '</span></button>';
      html += '</div>';

      html += '<div class="pr-content active" id="prFeatures">' + renderPRTimeline(filteredFeatures, '📰', 'No PR features in this date range', function(feat) {
        var row = '<div class="pr-item"><div class="pr-item-header"><span class="pr-item-publication">' + escapeHtml(feat.publication) + '</span><span class="pr-item-date">' + escapeHtml(feat.date) + '</span></div>';
        if (feat.theme) row += '<div class="pr-item-theme">' + escapeHtml(feat.theme) + '</div>';
        if (feat.link && feat.link.trim() !== '') row += '<div class="pr-item-link"><a href="' + escapeHtml(feat.link) + '" target="_blank">View article →</a></div>';
        return row + '</div>';
      }) + '</div>';

      html += '<div class="pr-content" id="prNewsletter">' + renderPRTimeline(filteredNewsletter, '📧', 'No newsletter features in this date range', function(item) {
        var row = '<div class="pr-item" style="border-left-color:#60a5fa;"><div class="pr-item-header"><span class="pr-item-publication">Newsletter</span><span class="pr-item-date">' + escapeHtml(item.date) + '</span></div>';
        if (item.theme) row += '<div class="pr-item-theme">' + escapeHtml(item.theme) + '</div>';
        if (item.link && item.link.trim() !== '') row += '<div class="pr-item-link"><a href="' + escapeHtml(item.link) + '" target="_blank">View →</a></div>';
        return row + '</div>';
      }) + '</div>';

      html += '<div class="pr-content" id="prSocial">' + renderPRTimeline(filteredSocial, '📱', 'No social media features in this date range', function(item) {
        var row = '<div class="pr-item" style="border-left-color:#a855f7;"><div class="pr-item-header"><span class="pr-item-publication">' + escapeHtml(item.who || 'Social Media') + '</span><span class="pr-item-date">' + escapeHtml(item.date) + '</span></div>';
        if (item.theme) row += '<div class="pr-item-theme">' + escapeHtml(item.theme) + '</div>';
        if (item.link && item.link.trim() !== '') row += '<div class="pr-item-link"><a href="' + escapeHtml(item.link) + '" target="_blank">View post →</a></div>';
        if (item.stats) {
          var whoLower = String(item.who || '').toLowerCase();
          var statItems = whoLower.indexOf('facebook') !== -1 ? [
            { label: 'Views', val: item.stats.views },
            { label: 'Reach', val: item.stats.reach },
            { label: 'Reactions', val: item.stats.reactions },
            { label: 'Comments', val: item.stats.comments },
            { label: 'Shares', val: item.stats.shares },
            { label: 'Link Clicks', val: item.stats.linkClicks }
          ] : [
            { label: 'Views', val: item.stats.views },
            { label: 'Likes', val: item.stats.likes },
            { label: 'Comments', val: item.stats.comments },
            { label: 'Shares', val: item.stats.shares },
            { label: 'Saves', val: item.stats.saves }
          ];
          row += '<div class="sm-stats-bar">';
          for (var i = 0; i < statItems.length; i++) {
            row += '<div><div class="sm-stat-val">' + compactNumber(statItems[i].val) + '</div><div class="sm-stat-lbl">' + statItems[i].label + '</div></div>';
          }
          row += '</div>';
        }
        return row + '</div>';
      }) + '</div>';

      html += '<div class="pr-content" id="prSubmissions">' + renderPRTimeline(filteredSubmissions, '📝', 'No submissions in this date range', function(item) {
        var row = '<div class="pr-item" style="border-left-color: var(--f-grey-medium);"><div class="pr-item-header"><span class="pr-item-publication">' + escapeHtml(item.publication) + '</span><span class="pr-item-date">' + escapeHtml(item.date) + '</span></div>';
        if (item.theme) row += '<div class="pr-item-theme">' + escapeHtml(item.theme) + '</div>';
        return row + '</div>';
      }) + '</div>';

      prContent.innerHTML = html;
    }

    function renderPRTimeline(items, icon, emptyText, renderItem) {
      if (!items || items.length === 0) {
        return '<div class="pr-empty"><div class="pr-empty-icon">' + icon + '</div><p>' + emptyText + '</p></div>';
      }
      var html = '<div class="pr-timeline">';
      items.forEach(function(item) { html += renderItem(item); });
      html += '</div>';
      return html;
    }

    function switchPRTab(tab, btnElement) {

    // Reach and interactions for a post. New links carry raw numbers
    // (reachN / interN); links made before this change only carry the
    // formatted stats, so those are read back from their labels.
    function crStatNumber(value) {
      var t = String(value || '').replace(/,/g, '').trim().toLowerCase();
      var n = parseFloat(t);
      if (isNaN(n)) return 0;
      if (/k$/.test(t)) n *= 1000;
      if (/m$/.test(t)) n *= 1000000;
      return Math.round(n);
    }

    function crCompactNumber(n) {
      n = Number(n) || 0;
      if (n >= 1000000) return (n / 1000000).toFixed(1).replace(/\.0$/, '') + 'm';
      if (n >= 10000) return (n / 1000).toFixed(1).replace(/\.0$/, '') + 'k';
      return Math.round(n).toLocaleString('en-GB');
    }

    function crPostFigures(post) {
      var reach = Number(post.reachN) || 0;
      var inter = Number(post.interN) || 0;
      var visits = 0;
      var reachText = '';
      (post.stats || []).forEach(function(st) {
        var label = String(st.label || '').toLowerCase();
        if (label === 'reach' || (label === 'views' && !reachText)) reachText = st.value;
        if (label.indexOf('visits') === 0) visits = crStatNumber(st.value);
        if (!post.interN && /^(likes|reactions|saves|shares|comments)$/.test(label)) inter += crStatNumber(st.value);
      });
      return {
        reach: reach ? crCompactNumber(reach) : (reachText || ''),
        inter: inter ? crCompactNumber(inter) : '',
        visits: visits ? crCompactNumber(visits) : ''
      };
    }

    function crShowAllPosts(btn) {
      var hidden = document.querySelectorAll('.cr-more-post');
      for (var i = 0; i < hidden.length; i++) hidden[i].classList.remove('cr-hidden');
      if (btn && btn.parentNode) btn.parentNode.removeChild(btn);
    }

    function drawClientTrendChart(chart) {
      var canvas = document.getElementById('crTrendChart');
      if (!canvas || typeof Chart === 'undefined') return;
      var trend = chart.trend || [];
      var labels = [];
      var views = [];
      var index = {};
      trend.forEach(function(t, i) {
        index[t.d] = i;
        var parts = String(t.d).split('-');
        var monthNames = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
        labels.push(parts.length === 3 ? Number(parts[2]) + ' ' + monthNames[Number(parts[1]) - 1] : t.d);
        views.push(t.v);
      });
      function markerData(type) {
        var data = views.map(function() { return null; });
        var names = views.map(function() { return []; });
        (chart.moments || []).forEach(function(m) {
          if (m.type !== type || index[m.d] === undefined) return;
          data[index[m.d]] = views[index[m.d]];
          names[index[m.d]].push(m.label);
        });
        return { data: data, names: names };
      }
      // Always a running total (links created before this change carry mode 'daily').
      var cumulative = true;
      var daily = views.slice();
      if (cumulative) {
        var running = 0;
        views = views.map(function(v) { running += v; return running; });
      }
      var pressMarks = markerData('press');
      var socialMarks = markerData('social');
      var ctx = canvas.getContext('2d');
      var crChart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [
            { label: 'Press', data: pressMarks.data, names: pressMarks.names, showLine: false, pointRadius: 7, pointHoverRadius: 9, pointBackgroundColor: '#E7755C', pointBorderColor: '#FFFFFF', pointBorderWidth: 2, order: 0 },
            { label: 'Social & newsletter', data: socialMarks.data, names: socialMarks.names, showLine: false, pointRadius: 6, pointHoverRadius: 8, pointBackgroundColor: '#2F6461', pointBorderColor: '#FFFFFF', pointBorderWidth: 2, order: 1 },
            { label: 'Daily views', data: views, daily: daily, borderColor: '#002A29', backgroundColor: 'rgba(0,42,41,0.06)', borderWidth: 2.5, fill: true, tension: cumulative ? 0 : 0.3, pointRadius: 0, pointHoverRadius: 5, order: 2 }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          interaction: { mode: 'index', intersect: false },
          plugins: {
            legend: { display: false },
            tooltip: {
              filter: function(item) { return item.raw !== null; },
              callbacks: {
                label: function(item) {
                  if (item.dataset.label === 'Daily views') {
                    var dayViews = (item.dataset.daily || [])[item.dataIndex];
                    return cumulative ? Number(item.raw).toLocaleString('en-GB') + ' views to date (' + dayViews + ' that day)' : item.raw + ' views';
                  }
                  var names = (item.dataset.names || [])[item.dataIndex] || [];
                  return item.dataset.label + ': ' + names.join(', ');
                }
              }
            }
          },
          scales: {
            x: { grid: { display: false }, ticks: { maxTicksLimit: 6, color: '#5B6B69', maxRotation: 0 } },
            y: { beginAtZero: true, grid: { color: '#ECE7DF' }, ticks: { color: '#5B6B69', precision: 0 } }
          }
        }
      });
      // Redraw at the page width when printing / saving as PDF.
      window.addEventListener('beforeprint', function() { crChart.resize(); });
      window.addEventListener('afterprint', function() { crChart.resize(); });
    }

      if (top.length) {
        var allOffices = msState.office === 'All offices';
        html += '<section class="cr-section"><div class="cr-section-head"><h2 class="cr-h2">Most-viewed properties</h2>';
        html += '<span class="cr-muted">' + (allOffices ? 'Live listings · Finest and partners · top ' + top.length : crEsc(msState.office) + ' · live listings') + '</span></div>';
        html += '<div class="cr-posts"><div class="ms-top-head"><span>#</span><span>Property</span><span>Office</span><span class="cr-r">Views</span><span class="cr-r">On ' + crEsc(r.prevMonthName || 'last month') + '</span></div>';
        top.forEach(function(t, i) {
          var url = crSafeUrl(t.url);
          var down = /^▼/.test(t.change || '');
          html += '<div class="ms-top-row' + (i >= 10 ? ' cr-hidden ms-more-top' : '') + '">';
          html += '<span class="num ms-rank' + (i < 3 ? ' lead' : '') + '">' + (i + 1) + '</span>';
          html += '<span class="ms-prop"><' + (url ? 'a href="' + crEsc(url) + '" target="_blank" rel="noopener"' : 'span') + ' class="ms-prop-name">' + crEsc(t.name) + '</' + (url ? 'a' : 'span') + '><span class="ms-prop-status">' + crEsc(t.status || '') + '</span></span>';
          html += '<span class="ms-office-name' + (t.partner ? ' partner' : '') + '">' + crEsc(displayOffice(t.office)) + '</span>';
          html += '<span class="cr-post-fig num">' + Number(t.views || 0).toLocaleString('en-GB') + '</span>';
          html += '<span class="ms-change num' + (down ? ' down' : (t.change === 'New listing' ? ' new' : '')) + '">' + crEsc(t.change || '') + '</span></div>';
        });
        html += '</div>';
        if (top.length > 10) html += '<button type="button" class="cr-btn ms-light-btn" onclick="msShowAllTop(this)">Show all ' + top.length + '</button>';
        html += '</section>';
      }

      // The Finest Edit: brand reach and engagement, in a few plain figures.
      // Network-wide; an office sees which of its homes were featured.
      (r.editions || []).forEach(function(ed) {
        var office = msState.office, allOff = office === 'All offices';
        var fmt = function(n) { return Number(n || 0).toLocaleString('en-GB'); };
        var pct = function(n) { return ed.sent && n ? (Math.round(n / ed.sent * 1000) / 10) + '%' : ''; };
        var openRate = pct(ed.opened), ctr = pct(ed.clicked);
        var featured = ed.featured || [];

        html += '<section class="cr-section"><div class="cr-section-head"><div><h2 class="cr-h2">' + crEsc(ed.title) + '</h2>';
        var sub = [];
        if (ed.edition) sub.push('Edition ' + ed.edition);
        if (ed.date) sub.push('sent ' + crEsc(ed.date));
        html += '<p class="cr-muted ms-ed-summary">' + sub.join(' · ') + '</p></div>';
        if (crSafeUrl(ed.link)) html += '<a href="' + crEsc(crSafeUrl(ed.link)) + '" target="_blank" rel="noopener" style="font-size:14px; font-weight:700; white-space:nowrap;">View the newsletter →</a>';
        html += '</div>';

        var monthWord = String(ed.title || '').replace(/^The Finest Edit · /, '').split(' ')[0];
        var sentence = 'Our ' + monthWord + ' issue reached ' + fmt(ed.sent) + ' subscribers.';
        var after = [];
        if (ed.visits) after.push('visiting our listings ' + fmt(ed.visits) + ' times');
        if (ed.homesBrowsed > 1) after.push('browsing ' + fmt(ed.homesBrowsed) + ' different homes');
        if (openRate) sentence += ' ' + openRate + ' opened it';
        if (ctr) sentence += (openRate ? ', and ' : ' ') + ctr + ' clicked through' + (after.length ? ', ' + after.join(' and ') : '');
        if (openRate || ctr) sentence += '.';
        html += '<p class="ms-ed-sentence">' + crEsc(sentence) + '</p>';

        var tiles = [];
        if (ed.sent) tiles.push(['Subscribers reached', fmt(ed.sent), 'Received the newsletter']);
        if (openRate) tiles.push(['Open rate', openRate, 'Of subscribers opened it']);
        else if (ctr) tiles.push(['Click-through rate', ctr, 'Of subscribers clicked through']);
        if (ed.visits) tiles.push(['Visits to our listings', fmt(ed.visits), 'From the newsletter']);
        if (featured.length) tiles.push(['Homes featured', fmt(featured.length), 'Finest and partner homes']);
        if (tiles.length) {
          html += '<div class="cr-kpis">';
          tiles.forEach(function(t) { html += '<div class="cr-kpi"><span class="cr-kpi-label">' + crEsc(t[0]) + '</span><span class="cr-kpi-value num">' + crEsc(t[1]) + '</span><span class="cr-kpi-note">' + crEsc(t[2]) + '</span></div>'; });
          html += '</div>';
        }

        if (!allOff) {
          var mine = featured.filter(function(h) { return h.office === office; });
          var oname = displayOffice(office).replace(/^Finest /, '');
          if (mine.length) {
            html += '<div class="ms-ed-office">' + mine.length + ' ' + crEsc(oname) + (mine.length === 1 ? ' home' : ' homes') + ' featured in this issue: ' + mine.map(function(h) { return crEsc(h.name); }).join(', ') + '.</div>';
          } else {
            var next = new Date(r.year, r.month, 1);
            var nextName = next.toLocaleString('en-GB', { month: 'long' });
            html += '<div class="ms-ed-office">No ' + crEsc(oname) + ' homes in this issue. The ' + nextName + ' issue goes out in the first week of ' + nextName + '; ask marketing if you’d like a home featured.</div>';
          }
        }
        html += '</section>';
      });

      // Press (and The Finest Edit rows when Brevo figures aren't available)
      var press = (r.press || []).filter(function(p) { return msInOffice(p.office); });
      var editions = r.editions || [];
      var issues = (editions.length ? [] : (r.newsletter || [])).map(function(iss) {
        var homes = iss.homes.filter(function(h) { return msInOffice(h.office); });
        return { date: iss.date, link: iss.link, homes: homes };
      }).filter(function(iss) { return iss.homes.length; });
      if (press.length || issues.length) {
        html += '<section class="cr-section"><div><h2 class="cr-h2">' + (issues.length ? 'Press and The Finest Edit' : 'Press') + '</h2>';
        html += '<p class="cr-muted" style="margin:6px 0 0;">Finest properties only. Each item links to the ' + (issues.length ? 'article or newsletter' : 'article') + '.</p></div><div class="cr-posts">';
        press.forEach(function(p) {
          var link = crSafeUrl(p.link);
          html += '<div class="ms-act-row">' + '<span class="cr-platform press">Press</span><span class="cr-post-date num">' + crEsc(p.date) + '</span>';
          html += '<span class="cr-post-text" style="font-weight:700;">' + crEsc(p.property) + '</span>';
          html += '<span class="cr-post-text ms-detail" title="' + crEsc(p.publication + (p.theme ? ' · ' + p.theme : '')) + '">' + crEsc(p.publication + (p.theme ? ' · ' + p.theme : '')) + '</span>';
          html += link ? '<a class="cr-post-link" href="' + crEsc(link) + '" target="_blank" rel="noopener">View →</a>' : '<span></span>';
          html += '</div>';
        });
        issues.forEach(function(iss) {
          var link = crSafeUrl(iss.link);
          var names = iss.homes.map(function(h) { return h.name; }).join(', ');
          var detail = (msState.office === 'All offices' && r.newsletterVisits ? Number(r.newsletterVisits).toLocaleString('en-GB') + ' visits to featured homes · ' : '') + names;
          html += '<div class="ms-act-row"><span class="cr-platform newsletter">The Finest Edit</span><span class="cr-post-date num">' + crEsc(iss.date) + '</span>';
          html += '<span class="cr-post-text" style="font-weight:700;">' + iss.homes.length + (iss.homes.length === 1 ? ' home featured' : ' homes featured') + '</span>';
          html += '<span class="cr-post-text ms-detail" title="' + crEsc(detail) + '">' + crEsc(detail) + '</span>';
          html += link ? '<a class="cr-post-link" href="' + crEsc(link) + '" target="_blank" rel="noopener">View →</a>' : '<span></span>';
          html += '</div>';
        });
        html += '</div></section>';
      }

      // Social media
      var posts = (r.social || []).filter(function(p) { return msInOffice(p.office); });
      if (posts.length) {
        var homesCount = {};
        posts.forEach(function(p) { homesCount[p.property] = true; });
        html += '<section class="cr-section"><div><h2 class="cr-h2">Social media</h2>';
        html += '<p class="cr-muted" style="margin:6px 0 0;">' + posts.length + (posts.length === 1 ? ' post' : ' posts') + ' featuring ' + Object.keys(homesCount).length + ' Finest ' + (Object.keys(homesCount).length === 1 ? 'home' : 'homes') + ' this month.</p></div>';
        var platforms = {};
        posts.forEach(function(p) {
          if (!platforms[p.platform]) platforms[p.platform] = { key: p.key, posts: 0, reach: 0, inter: 0 };
          platforms[p.platform].posts++;
          platforms[p.platform].reach += p.reach || 0;
          platforms[p.platform].inter += p.inter || 0;
        });
        var names = Object.keys(platforms).sort(function(a, b) { return platforms[b].posts - platforms[a].posts; });
        html += '<div class="ms-tiles">';
        names.forEach(function(n) {
          var p = platforms[n];
          html += '<div class="cr-card ms-tile">' + msBadge(p.key, n) + '<span class="num ms-tile-big">' + p.posts + ' <small>' + (p.posts === 1 ? 'post' : 'posts') + '</small></span>';
          html += '<span class="cr-muted" style="font-size:13px;">' + (p.reach ? crCompactNumber(p.reach) + ' combined reach · ' + crCompactNumber(p.inter) + ' interactions' : 'Shared with our followers') + '</span></div>';
        });
        html += '</div>';

        var best = posts.filter(function(p) { return p.reach; }).sort(function(a, b) { return b.reach - a.reach; }).slice(0, 5);
        if (best.length) {
          html += '<h3 class="ms-h3">Best-performing posts</h3>' + msPostTable(best);
        }
        html += '<button type="button" class="cr-btn ms-light-btn" onclick="msToggleAll()">' + (msState.showAll ? 'Hide the full list' : 'See all ' + posts.length + ' posts') + '</button>';
        if (msState.showAll) {
          html += '<div class="ms-chips" role="group" aria-label="Platform">';
          ['All'].concat(names).forEach(function(n) {
            var count = n === 'All' ? posts.length : platforms[n].posts;
            html += '<button type="button" class="ms-chip' + (n === msState.social ? ' on' : '') + '" onclick="msSetSocial(' + crEsc(JSON.stringify(n)) + ')">' + crEsc(n) + ' · ' + count + '</button>';
          });
          html += '</div>';
          var filtered = posts.filter(function(p) { return msState.social === 'All' || p.platform === msState.social; });
          html += msPostTable(filtered.slice(0, msState.shown));
          html += '<div style="display:flex; gap:12px; align-items:center; flex-wrap:wrap;"><span class="cr-muted" style="font-size:13px;">Showing ' + Math.min(msState.shown, filtered.length) + ' of ' + filtered.length + ' · newest first</span>';
          if (filtered.length > msState.shown) html += '<button type="button" class="cr-btn ms-light-btn" onclick="msMore()">Show more</button>';
          html += '</div>';
        }
        html += '</section>';
      }

      html += '<footer class="cr-footer" style="flex-direction:column; gap:8px;"><span><strong style="color:#0E2524;">What the figures mean:</strong> <strong>Views</strong> = times a property page was opened. <strong>People</strong> = individual visitors. <strong>Reach</strong> = people who saw a social post, as reported by each platform. <strong>Interactions</strong> = likes or reactions, comments, shares and saves.</span>';
      html += '<span>' + crEsc(r.sourceNote || '') + '</span></footer>';
      html += '</main></div>';

      var container = document.querySelector('.container');
      (container || document.body).innerHTML = html;
      window.scrollTo(0, scrollY);
    }

    function msPostTable(list) {
      var html = '<div class="cr-posts"><div class="cr-posts-head"><span>Platform</span><span>Date</span><span>Property</span><span class="cr-r">Reach</span><span class="cr-r">Interactions</span><span></span></div>';
      list.forEach(function(p) {
        var link = crSafeUrl(p.link);
        html += '<div class="cr-post-row">' + msBadge(p.key, p.platform) + '<span class="cr-post-date num">' + crEsc(p.date) + '</span>';
        html += '<span class="cr-post-text" title="' + crEsc(p.property) + '">' + crEsc(p.property) + '</span>';
        html += '<span class="cr-post-fig reach num' + (p.reach ? '' : ' empty') + '">' + (p.reach ? crCompactNumber(p.reach) + '<span class="cr-m-label"> reach</span>' : '–') + '</span>';
        html += '<span class="cr-post-fig inter num' + (p.reach ? '' : ' empty') + '">' + (p.reach ? crCompactNumber(p.inter) + '<span class="cr-m-label"> interactions</span>' : '–') + '</span>';
        html += link ? '<a class="cr-post-link" href="' + crEsc(link) + '" target="_blank" rel="noopener">View →</a>' : '<span></span>';
        html += '</div>';
      });
      return html + '</div>';
    }

    function msShowAllTop(btn) {
      var rows = document.querySelectorAll('.ms-more-top');
      for (var i = 0; i < rows.length; i++) rows[i].classList.remove('cr-hidden');
      if (btn && btn.parentNode) btn.parentNode.removeChild(btn);
    }

    function showReportExpired() {
      showReportNotice('This report has now expired',
        'For your privacy, marketing reports are only available for a limited time. Please ask your Finest contact for an up-to-date report \u2013 it\u2019ll include the latest figures.', false);
    }

    function showReportNotice(title, message, offerRetry) {
      document.body.classList.add('client-report');
      document.title = 'Your marketing report \u00b7 Finest';
      var html = '<div class="cr"><header class="cr-hero"><div class="cr-wrap">';
      html += '<div class="cr-top"><div>' + CR_LOGO_SVG + '<div class="cr-logo-sub" style="margin-top:10px;">Your marketing report</div></div></div>';
      html += '<div class="cr-notice"><h1 class="cr-title cr-notice-title">' + crEsc(title) + '</h1>';
      html += '<p class="cr-headline">' + crEsc(message) + '</p>';
      if (offerRetry) html += '<button type="button" class="cr-btn" onclick="window.location.reload()" style="align-self:flex-start;">Try again</button>';
      html += '</div></div></header>';
      html += '<main class="cr-wrap"><footer class="cr-footer" style="margin-top:32px;"><span>finest.co.uk</span></footer></main></div>';
      var container = document.querySelector('.container');
      (container || document.body).innerHTML = html;
      if (container) {
        container.style.maxWidth = 'none';
        container.style.margin = '0';
      }
    }

    function showError(message) {
      document.getElementById('reportSubtitle').textContent = '';
      document.getElementById('content').innerHTML = '<div class="error"><p>' + escapeHtml(message) + '</p></div>';
    }

    function formatNum(n) {
      n = parseInt(n, 10) || 0;
      if (n >= 1000000) return (n / 1000000).toFixed(1) + 'm';
      if (n >= 1000) return (n / 1000).toFixed(1) + 'k';
      return String(n);
    }
    function compactNumber(n) { return formatNum(n); }
    function escapeHtml(text) {
      if (text === null || text === undefined) return '';
      var div = document.createElement('div');
      div.textContent = String(text);
      return div.innerHTML;
    }
    function formatDisplayDate(dateStr) {
      if (!dateStr) return '';
      if (/^\d{4}-\d{2}-\d{2}$/.test(dateStr)) {
        var parts = dateStr.split('-');
        return new Date(parts[0], parts[1] - 1, parts[2]).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
      }
      var prDate = parsePRDate(dateStr);
      if (prDate) return prDate.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
      return dateStr;
    }
    function formatDisplayDateTime(dateStr) {
      if (!dateStr) return '';
      var d = new Date(dateStr);
      if (!isNaN(d.getTime())) {
        return d.toLocaleString('en-GB', {
          day: 'numeric',
          month: 'short',
          year: 'numeric',
          hour: '2-digit',
          minute: '2-digit'
        });
      }
      return dateStr;
    }
    function formatChartDate(dateStr) {
      var d = /^\d{4}-\d{2}-\d{2}$/.test(dateStr) ? new Date(dateStr + 'T00:00:00') : new Date(dateStr);
      return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
    }
    function formatDuration(seconds) {
      var total = Math.round(Number(seconds) || 0);
      var mins = Math.floor(total / 60);
      var secs = total % 60;
      if (mins <= 0) return secs + 's';
      return mins + 'm ' + secs + 's';
    }
  </script>
</body>
</html>
